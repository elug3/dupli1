# Preview stack on VENUS: the production stack, a second time, under its own
# compose project (dupli1-preview), with its own Postgres, Redis, NATS and
# SeaweedFS and no production secret. Layered on docker-compose.yml by
# preview.sh; see docs/deployment-preview.md.
#
#   preview.dupli1.com        → web
#   manage-preview.dupli1.com → manage-web
#
# Secrets come from /opt/dupli1-preview/.env, which `preview.sh setup` writes
# with fresh values. Nano Pay and Telegram are left empty: card checkout is
# unavailable (pay with Bypass) and neither bot runs.

services:
  # A fresh Postgres has none of the databases production imported from AWS,
  # so create them all, not just the VENUS-only ones.
  db-init:
    command:
      - |
        psql -h postgres -U postgres -X -q -v ON_ERROR_STOP=1 -v pw="$$APP_PASSWORD" <<'SQL'
        SELECT format('CREATE ROLE schick LOGIN PASSWORD %L', :'pw') WHERE NOT EXISTS (SELECT FROM pg_roles WHERE rolname = 'schick') \gexec
        SELECT format('CREATE DATABASE %I OWNER schick', d) FROM unnest(ARRAY['schick_db','products','orders','cart','payments','notifications','profiles','support']) AS d WHERE NOT EXISTS (SELECT FROM pg_database WHERE datname = d) \gexec
        SQL

  auth:
    environment:
      # The preview's own owner account; the password is in the preview .env.
      OWNER_EMAIL: ${OWNER_EMAIL:?run preview.sh setup}
      OWNER_PASSWORD: ${OWNER_PASSWORD:?run preview.sh setup}
    depends_on: { db-init: { condition: service_completed_successfully } }
  product:
    depends_on: { db-init: { condition: service_completed_successfully } }
  order:
    depends_on: { db-init: { condition: service_completed_successfully } }
  cart:
    depends_on: { db-init: { condition: service_completed_successfully } }
  payment:
    depends_on: { db-init: { condition: service_completed_successfully } }

  # Production's edge publishes :80 and is what cloudflared reaches as
  # "edge". Never start a second one: it would fail on the port, and on the
  # production network its name would take half of production's traffic.
  edge:
    profiles: ["production-only"]

  # The preview's edge. It also joins production's network so production's
  # cloudflared reaches it as preview-edge:8080 — a name nothing there has.
  # Because it sits on both networks, it names its upstreams by container
  # (dupli1-preview-web-1, …), never by service name, which would resolve to
  # production's containers too. :80 is published on loopback only, for
  # deploy.sh's health checks.
  preview-edge:
    restart: unless-stopped
    logging:
      driver: json-file
      options: { max-size: "20m", max-file: "5" }
    image: nginx:1.27-alpine
    volumes:
      - ./nginx-edge.preview.conf:/etc/nginx/conf.d/default.conf:ro
    ports:
      - "127.0.0.1:8090:80"
    networks:
      default: {}
      production: {}
    depends_on: [proxy, web, manage-web, s3]

networks:
  production:
    external: true
    name: dupli1_default
