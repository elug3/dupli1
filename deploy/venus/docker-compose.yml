# Self-hosted production on VENUS (replaces ECS + RDS + ALB + S3/CloudFront).
# See docs/deployment-venus.md.
#
# Started from the exact images production ran on ECS (pulled by digest, tagged
# dupli1-prod/<name>:<date>) with the ECS task-definition environment. Backend
# services, web and manage-web built by CI follow DUPLI1_BACKEND_TAG,
# DUPLI1_WEB_TAG and DUPLI1_MANAGE_WEB_TAG, which deploy.sh sets. Each
# container carries its Cloud Map name (auth.dupli1.local, …) as a network
# alias, so service-to-service URLs are unchanged from ECS.
#
# Secrets come from /opt/dupli1/.env (written by make-env.sh, never committed):
#   docker compose -f deploy/venus/docker-compose.yml --env-file /opt/dupli1/.env up -d

name: dupli1

x-service: &service
  restart: unless-stopped
  logging:
    driver: json-file
    options: { max-size: "20m", max-file: "5" }

# Sentry error and log reporting (docs/sentry-monitoring.md). Each app is off
# until its DSN is set in /opt/dupli1/.env: SENTRY_DSN_BACKEND for the Go
# services (shared/pkg/sentrymon), SENTRY_DSN_WEB and SENTRY_DSN_MANAGE_WEB
# below. The release is the image tag deploy.sh rolls out.
x-sentry-env: &sentry-env
  SENTRY_DSN: ${SENTRY_DSN_BACKEND:-}
  SENTRY_ENVIRONMENT: ${SENTRY_ENVIRONMENT:-production}
  SENTRY_RELEASE: ${DUPLI1_BACKEND_TAG:-}
  SENTRY_TRACES_SAMPLE_RATE: ${SENTRY_TRACES_SAMPLE_RATE:-0}

services:
  # ── state ────────────────────────────────────────────────────────────────
  postgres:
    <<: *service
    image: postgres:16
    environment:
      POSTGRES_PASSWORD: ${PG_SUPERUSER_PASSWORD:?run make-env.sh}
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 5s
      timeout: 5s
      retries: 20

  # Creates the VENUS-only databases (not in the AWS dumps) if missing, then
  # exits. Services that need one depend on it, so `deploy.sh` (which runs
  # `compose up` with dependencies) creates a new database before the first
  # container that uses it starts — no manual psql step to forget.
  db-init:
    image: postgres:16
    restart: "no"
    logging:
      driver: json-file
      options: { max-size: "20m", max-file: "5" }
    environment:
      PGPASSWORD: ${PG_SUPERUSER_PASSWORD:?run make-env.sh}
      APP_PASSWORD: ${DB_APP_PASSWORD}
    entrypoint: ["sh", "-c"]
    # The services connect as schick. On VENUS it came with the AWS import;
    # a fresh host gets it here. An existing role is never altered.
    command:
      - |
        psql -h postgres -U postgres -X -q -v ON_ERROR_STOP=1 -v pw="$$APP_PASSWORD" <<'SQL'
        SELECT format('CREATE ROLE schick LOGIN PASSWORD %L', :'pw') WHERE NOT EXISTS (SELECT FROM pg_roles WHERE rolname = 'schick') \gexec
        SELECT 'CREATE DATABASE notifications OWNER schick' WHERE NOT EXISTS (SELECT FROM pg_database WHERE datname = 'notifications') \gexec
        SELECT 'CREATE DATABASE profiles OWNER schick' WHERE NOT EXISTS (SELECT FROM pg_database WHERE datname = 'profiles') \gexec
        SELECT 'CREATE DATABASE support OWNER schick' WHERE NOT EXISTS (SELECT FROM pg_database WHERE datname = 'support') \gexec
        SQL
    depends_on: { postgres: { condition: service_healthy } }

  # S3-compatible object store for product images (was S3 + CloudFront).
  # SeaweedFS because MinIO stopped publishing community images. Identities:
  # dupli1 (the product service) is full access; anonymous may only read
  # objects in product-images — no listing — which the edge serves publicly.
  s3:
    <<: *service
    image: chrislusf/seaweedfs:4.47
    entrypoint: ["/bin/sh", "-c"]
    command:
      - |
        umask 077
        cat > /tmp/s3.json <<EOF
        {"identities": [
          {"name": "dupli1", "credentials": [{"accessKey": "dupli1", "secretKey": "$$S3_SECRET_KEY"}],
           "actions": ["Admin", "Read", "List", "Tagging", "Write"]},
          {"name": "anonymous", "actions": ["Read:product-images"]}
        ]}
        EOF
        exec weed server -dir=/data -s3 -s3.port=8333 -s3.config=/tmp/s3.json -volume.max=0 -master.volumeSizeLimitMB=1024
    environment:
      S3_SECRET_KEY: ${S3_SECRET_KEY:?run make-env.sh}
    volumes:
      - s3data:/data
    healthcheck:
      test: ["CMD", "wget", "-qO", "/dev/null", "http://127.0.0.1:8333/healthz"]
      interval: 5s
      timeout: 5s
      retries: 30

  # Production ran both without persistence; kept identical.
  redis:
    <<: *service
    image: dupli1-prod/redis:${DUPLI1_IMAGE_TAG:-2026-09-26}
    networks: { default: { aliases: [redis.dupli1.local] } }

  nats:
    <<: *service
    image: dupli1-prod/nats:${DUPLI1_IMAGE_TAG:-2026-09-26}
    command: ["-js"]
    networks: { default: { aliases: [nats.dupli1.local] } }

  # ── services (env mirrors the ECS task definitions) ──────────────────────
  auth:
    <<: *service
    image: dupli1-prod/auth:${DUPLI1_BACKEND_TAG:-${DUPLI1_IMAGE_TAG:-2026-09-26}}
    entrypoint: ["/usr/local/bin/service"]
    command: []
    environment:
      <<: *sentry-env
      DUPLI1_AUTH_ADDR: ":8080"
      DB_URL: postgres://schick:${DB_APP_PASSWORD}@postgres:5432/schick_db?sslmode=disable
      REDIS_URL: redis://redis.dupli1.local:6379
      NATS_URL: nats://nats.dupli1.local:4222
      JWT_SECRET: ${JWT_SECRET:?run make-env.sh}
      JWT_PRIVATE_KEY_FILE: /run/secrets/jwt_private_key.pem
      DUPLI1_WEB_SERVICE_EMAIL: dupli1-web@web.dupli1.com
      DUPLI1_ORDER_SERVICE_EMAIL: ${DUPLI1_ORDER_SERVICE_EMAIL:?run make-env.sh}
      # Service accounts have no password: each authenticates with its API
      # key (docs/auth-service-api-keys.md), the same value its service gets
      # below. Change a key to rotate it; auth refuses to start without one.
      DUPLI1_ORDER_SERVICE_API_KEY: ${DUPLI1_ORDER_SERVICE_API_KEY:?set it in /opt/dupli1/.env — docs/auth-service-api-keys.md}
      DUPLI1_WEB_SERVICE_API_KEY: ${DUPLI1_WEB_SERVICE_API_KEY:?set it in /opt/dupli1/.env — docs/auth-service-api-keys.md}
    volumes:
      - /opt/dupli1/secrets/jwt_private_key.pem:/run/secrets/jwt_private_key.pem:ro
    depends_on: { postgres: { condition: service_healthy }, redis: { condition: service_started }, nats: { condition: service_started } }
    networks: { default: { aliases: [auth.dupli1.local] } }

  product:
    <<: *service
    image: dupli1-prod/product:${DUPLI1_BACKEND_TAG:-${DUPLI1_IMAGE_TAG:-2026-09-26}}
    environment:
      <<: *sentry-env
      SERVER_HOST: 0.0.0.0
      SERVER_PORT: "8080"
      DUPLI1_PRODUCT_DB: postgres://schick:${DB_APP_PASSWORD}@postgres:5432/products?sslmode=disable
      AUTH_JWKS_URL: http://auth.dupli1.local:8080/api/v1/auth/.well-known/jwks.json
      JWT_SECRET: ${JWT_SECRET}
      NATS_URL: nats://nats.dupli1.local:4222
      S3_ENDPOINT: http://s3:8333
      S3_BUCKET: product-images
      S3_PUBLIC_ENDPOINT: ${PUBLIC_ORIGIN:-https://dupli1.com}/product-images
      S3_ACCESS_KEY: dupli1
      S3_SECRET_KEY: ${S3_SECRET_KEY}
    depends_on: { postgres: { condition: service_healthy }, s3: { condition: service_healthy }, auth: { condition: service_started } }
    networks: { default: { aliases: [product.dupli1.local] } }

  order:
    <<: *service
    image: dupli1-prod/order:${DUPLI1_BACKEND_TAG:-${DUPLI1_IMAGE_TAG:-2026-09-26}}
    environment:
      <<: *sentry-env
      DUPLI1_ORDER_ADDR: ":8080"
      DUPLI1_ORDER_DB: postgres://schick:${DB_APP_PASSWORD}@postgres:5432/orders?sslmode=disable
      AUTH_JWKS_URL: http://auth.dupli1.local:8080/api/v1/auth/.well-known/jwks.json
      DUPLI1_AUTH_URL: http://auth.dupli1.local:8080
      # The gateway's internal listener: :80 (what the edge reaches) refuses
      # the internal APIs order calls (nginx-gateway.conf).
      DUPLI1_GATEWAY_URL: http://proxy.dupli1.local:8081
      DUPLI1_INVENTORY_URL: http://product.dupli1.local:8080
      DUPLI1_PRODUCT_URL: http://product.dupli1.local:8080
      NATS_URL: nats://nats.dupli1.local:4222
      JWT_SECRET: ${JWT_SECRET}
      # The order service account's API key (same value auth seeds).
      DUPLI1_ORDER_SERVICE_API_KEY: ${DUPLI1_ORDER_SERVICE_API_KEY:?set it in /opt/dupli1/.env — docs/auth-service-api-keys.md}
    depends_on: { postgres: { condition: service_healthy }, auth: { condition: service_started } }
    networks: { default: { aliases: [order.dupli1.local] } }

  cart:
    <<: *service
    image: dupli1-prod/cart:${DUPLI1_BACKEND_TAG:-${DUPLI1_IMAGE_TAG:-2026-09-26}}
    environment:
      <<: *sentry-env
      DUPLI1_CART_ADDR: ":8080"
      DUPLI1_CART_DB: postgres://schick:${DB_APP_PASSWORD}@postgres:5432/cart?sslmode=disable
      AUTH_JWKS_URL: http://auth.dupli1.local:8080/api/v1/auth/.well-known/jwks.json
      DUPLI1_INVENTORY_URL: http://product.dupli1.local:8080
      DUPLI1_PRODUCT_URL: http://product.dupli1.local:8080
      JWT_SECRET: ${JWT_SECRET}
    depends_on: { postgres: { condition: service_healthy } }
    networks: { default: { aliases: [cart.dupli1.local] } }

  payment:
    <<: *service
    image: dupli1-prod/payment:${DUPLI1_BACKEND_TAG:-${DUPLI1_IMAGE_TAG:-2026-09-26}}
    environment:
      <<: *sentry-env
      DUPLI1_PAYMENT_ADDR: ":8080"
      DUPLI1_PAYMENT_DB: postgres://schick:${DB_APP_PASSWORD}@postgres:5432/payments?sslmode=disable
      AUTH_JWKS_URL: http://auth.dupli1.local:8080/api/v1/auth/.well-known/jwks.json
      DUPLI1_ORDER_URL: http://order.dupli1.local:8080
      DUPLI1_PAYMENT_PUBLIC_URL: ${PUBLIC_ORIGIN:-https://dupli1.com}
      NATS_URL: nats://nats.dupli1.local:4222
      JWT_SECRET: ${JWT_SECRET}
      NANO_BASE_URL: https://pay.nanopay.co.kr
      NANO_SUCCESS_URL: ${PUBLIC_ORIGIN:-https://dupli1.com}/checkout/confirmation
      NANO_FAILURE_URL: ${PUBLIC_ORIGIN:-https://dupli1.com}/checkout
      NANO_API_KEY: ${NANO_API_KEY:-}
      NANO_LOGIN_ID: ${NANO_LOGIN_ID:-}
      NANO_SHOPCODE: ${NANO_SHOPCODE:-}
      NANO_VER: ${NANO_VER:-}
    depends_on: { postgres: { condition: service_healthy } }
    networks: { default: { aliases: [payment.dupli1.local] } }

  profile:
    <<: *service
    image: dupli1-prod/profile:${DUPLI1_BACKEND_TAG:-${DUPLI1_IMAGE_TAG:-2026-09-26}}
    environment:
      <<: *sentry-env
      DUPLI1_PROFILE_ADDR: ":8080"
      # Customer profiles and saved shipping addresses. Without it profile ran
      # in memory (as it did on ECS) and lost every address on each restart
      # and deploy, so shoppers retyped their address at every checkout.
      DUPLI1_PROFILE_DB: postgres://schick:${DB_APP_PASSWORD}@postgres:5432/profiles?sslmode=disable
      AUTH_JWKS_URL: http://auth.dupli1.local:8080/api/v1/auth/.well-known/jwks.json
      NATS_URL: nats://nats.dupli1.local:4222
      JWT_SECRET: ${JWT_SECRET}
    depends_on: { db-init: { condition: service_completed_successfully } }
    networks: { default: { aliases: [profile.dupli1.local] } }

  notification:
    <<: *service
    image: dupli1-prod/notification:${DUPLI1_BACKEND_TAG:-${DUPLI1_IMAGE_TAG:-2026-09-26}}
    environment:
      <<: *sentry-env
      DUPLI1_NOTIFICATION_ADDR: ":8080"
      # Telegram chat subscriptions (accepted in manage-web). VENUS-only DB:
      # AWS ran notification in-memory, so approvals were lost on restart.
      DUPLI1_NOTIFICATION_DB: postgres://schick:${DB_APP_PASSWORD}@postgres:5432/notifications?sslmode=disable
      AUTH_JWKS_URL: http://auth.dupli1.local:8080/api/v1/auth/.well-known/jwks.json
      MANAGE_WEB_URL: https://manage.dupli1.com
      NATS_URL: nats://nats.dupli1.local:4222
      # Empty until cutover: one bot token must never be polled by AWS and
      # VENUS at the same time (Telegram answers the second poller with 409).
      TELEGRAM_BOT_TOKEN: ${TELEGRAM_BOT_TOKEN:-}
      TELEGRAM_ORDER_CHAT_ID: ${TELEGRAM_ORDER_CHAT_ID:-}
      TELEGRAM_PRODUCT_CHAT_ID: ${TELEGRAM_PRODUCT_CHAT_ID:-}
    depends_on: { db-init: { condition: service_completed_successfully } }
    networks: { default: { aliases: [notification.dupli1.local] } }

  # Customer support: the web consultation chat, product questions (상품 문의)
  # and the manage-web /support inbox; docs/support-web-chat.md and
  # docs/support-product-questions.md. Never deployed on ECS, so its database
  # is VENUS-only like notifications.
  support:
    <<: *service
    image: dupli1-prod/support:${DUPLI1_BACKEND_TAG:-${DUPLI1_IMAGE_TAG:-2026-09-26}}
    environment:
      <<: *sentry-env
      DUPLI1_SUPPORT_ADDR: ":8080"
      DUPLI1_SUPPORT_DB: postgres://schick:${DB_APP_PASSWORD}@postgres:5432/support?sslmode=disable
      AUTH_JWKS_URL: http://auth.dupli1.local:8080/api/v1/auth/.well-known/jwks.json
      JWT_SECRET: ${JWT_SECRET}
      NATS_URL: nats://nats.dupli1.local:4222
      # Product and order references are checked through the gateway with the
      # shopper's own token; the internal listener, like order's.
      DUPLI1_GATEWAY_URL: http://proxy.dupli1.local:8081
      # Links in reply-notice emails and staff alerts.
      DUPLI1_STOREFRONT_URL: ${PUBLIC_ORIGIN:-https://dupli1.com}
      MANAGE_WEB_URL: https://manage.dupli1.com
      # Reply-notice email. Unset, no email goes out; chat and questions work.
      DUPLI1_SUPPORT_SMTP_ADDR: ${DUPLI1_SUPPORT_SMTP_ADDR:-}
      DUPLI1_SUPPORT_SMTP_USERNAME: ${DUPLI1_SUPPORT_SMTP_USERNAME:-}
      DUPLI1_SUPPORT_SMTP_PASSWORD: ${DUPLI1_SUPPORT_SMTP_PASSWORD:-}
      DUPLI1_SUPPORT_SMTP_FROM: ${DUPLI1_SUPPORT_SMTP_FROM:-}
      # The customer Telegram bot — a different bot and token from
      # notification's TELEGRAM_BOT_TOKEN. Empty, the bot is inert and the web
      # channels still work. With no webhook URL it long-polls, which needs no
      # public route.
      TELEGRAM_SUPPORT_BOT_TOKEN: ${TELEGRAM_SUPPORT_BOT_TOKEN:-}
      TELEGRAM_SUPPORT_WEBHOOK_URL: ${TELEGRAM_SUPPORT_WEBHOOK_URL:-}
      TELEGRAM_SUPPORT_WEBHOOK_SECRET: ${TELEGRAM_SUPPORT_WEBHOOK_SECRET:-}
    depends_on: { db-init: { condition: service_completed_successfully }, auth: { condition: service_started }, nats: { condition: service_started } }
    networks: { default: { aliases: [support.dupli1.local] } }

  # ── HTTP ─────────────────────────────────────────────────────────────────
  # API gateway: production's nginx.ecs.conf with Docker's resolver.
  proxy:
    <<: *service
    image: dupli1-prod/proxy:${DUPLI1_BACKEND_TAG:-${DUPLI1_IMAGE_TAG:-2026-09-26}}
    volumes:
      - ./nginx-gateway.conf:/etc/nginx/conf.d/default.conf:ro
      # The shared route table and upstream names it includes, from the same
      # checkout, so the config and its includes always match — even when a
      # rollback runs an older proxy image.
      - ../../api/gateway:/etc/nginx/dupli1:ro
    networks: { default: { aliases: [proxy.dupli1.local] } }

  web:
    <<: *service
    image: dupli1-prod/web:${DUPLI1_WEB_TAG:-${DUPLI1_IMAGE_TAG:-2026-09-26}}
    environment:
      HOST: 0.0.0.0
      PORT: "3000"
      DUPLI1_API_BASE_URL: http://proxy.dupli1.local
      SENTRY_DSN: ${SENTRY_DSN_WEB:-}
      SENTRY_ENVIRONMENT: ${SENTRY_ENVIRONMENT:-production}
      SENTRY_RELEASE: ${DUPLI1_WEB_TAG:-}
      SENTRY_TRACES_SAMPLE_RATE: ${SENTRY_TRACES_SAMPLE_RATE:-0}
      # The web service account's API key (same value auth seeds). The
      # exchange is internal-only, so it goes to the gateway's :8081.
      DUPLI1_WEB_SERVICE_API_KEY: ${DUPLI1_WEB_SERVICE_API_KEY:?set it in /opt/dupli1/.env — docs/auth-service-api-keys.md}
      DUPLI1_WEB_SERVICE_AUTH_URL: http://proxy.dupli1.local:8081
      # Shopper sessions. Unset, they live in process memory and every web
      # deploy signs every shopper out (dupli1-web session-store.server.ts).
      DUPLI1_WEB_REDIS_URL: redis://redis.dupli1.local:6379

  manage-web:
    <<: *service
    image: dupli1-prod/manage-web-container:${DUPLI1_MANAGE_WEB_TAG:-${DUPLI1_IMAGE_TAG:-2026-09-26}}
    environment:
      PORT: "80"
      DUPLI1_API_BASE_URL: http://proxy.dupli1.local
      DUPLI1_GATEWAY_URL: http://proxy.dupli1.local
      REDIS_URL: redis://redis.dupli1.local:6379
      SENTRY_DSN: ${SENTRY_DSN_MANAGE_WEB:-}
      SENTRY_ENVIRONMENT: ${SENTRY_ENVIRONMENT:-production}
      SENTRY_RELEASE: ${DUPLI1_MANAGE_WEB_TAG:-}
      SENTRY_TRACES_SAMPLE_RATE: ${SENTRY_TRACES_SAMPLE_RATE:-0}

  # Replaces the ALB: host/path routing plus /product-images/ (was CloudFront).
  edge:
    <<: *service
    image: nginx:1.27-alpine
    volumes:
      - ./nginx-edge.conf:/etc/nginx/conf.d/default.conf:ro
    # :80 is direct HTTP for the home network; :8080 is cloudflared's
    # listener and stays unpublished (see nginx-edge.conf).
    ports:
      - "0.0.0.0:80:80"
    depends_on: [proxy, web, manage-web, s3]

  # Public ingress. Started only at cutover: `--profile tunnel up -d`.
  cloudflared:
    <<: *service
    image: cloudflare/cloudflared:2026.9.3
    profiles: ["tunnel"]
    command: ["tunnel", "--no-autoupdate", "run"]
    environment:
      # From the Cloudflare dashboard; cloudflared exits if it's empty.
      TUNNEL_TOKEN: ${CLOUDFLARE_TUNNEL_TOKEN:-}
    depends_on: [edge]

volumes:
  pgdata:
  s3data:
