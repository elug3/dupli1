# Gateway config for production on VENUS: api/nginx.ecs.conf with Docker's
# embedded DNS in place of the AWS VPC resolver. Routes live in
# api/gateway/routes.conf and upstream names in
# api/gateway/hosts.dupli1.local.conf; docker-compose.yml mounts both from the
# deploy checkout, so a rollback to an older proxy image still gets them.
resolver 127.0.0.11 valid=10s ipv6=off;

server {
    listen 80 default_server;
    # Internal listener: service-to-service only (order → product internal APIs).
    listen 8081;

    include /etc/nginx/dupli1/hosts.dupli1.local.conf;
    include /etc/nginx/dupli1/routes.conf;
}
