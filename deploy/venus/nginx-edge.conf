# Edge for VENUS — does what the ALB and CloudFront did on AWS.
#   manage.dupli1.com            → manage-web
#   /api/*, /gateway/*           → proxy (API gateway, nginx-gateway.conf)
#   /product-images/<key>        → SeaweedFS bucket product-images (was CloudFront)
#   everything else              → web (storefront)
# Reached through cloudflared (TLS terminates at Cloudflare) or locally on
# 127.0.0.1:80. Upstreams resolve per request so one service being down
# doesn't stop the edge from starting.

resolver 127.0.0.11 valid=10s ipv6=off;

# Cloudflare sends the client address in CF-Connecting-IP and the original
# scheme in X-Forwarded-Proto; fall back to the direct connection locally.
map $http_cf_connecting_ip $client_ip {
    ""      $remote_addr;
    default $http_cf_connecting_ip;
}
map $http_x_forwarded_proto $client_proto {
    ""      $scheme;
    default $http_x_forwarded_proto;
}

proxy_set_header Host              $host;
proxy_set_header X-Real-IP         $client_ip;
proxy_set_header X-Forwarded-For   $client_ip;
proxy_set_header X-Forwarded-Proto $client_proto;
proxy_http_version 1.1;
proxy_set_header Connection        "";
client_max_body_size 20m;
server_tokens off;

server {
    listen 80;
    server_name manage.dupli1.com;

    # Unbuffered: the live order feed is Server-Sent Events via manage-web.
    location / {
        set $upstream http://manage-web:80;
        proxy_pass $upstream;
        proxy_buffering off;
        proxy_read_timeout 1h;
    }
}

server {
    listen 80 default_server;
    server_name dupli1.com www.dupli1.com _;

    location /api/ {
        set $upstream http://proxy:80;
        proxy_pass $upstream;
    }

    location /gateway/ {
        set $upstream http://proxy:80;
        proxy_pass $upstream;
    }

    # Public read of product images only; the bucket itself is not listable.
    location /product-images/ {
        limit_except GET HEAD { deny all; }
        set $upstream http://s3:8333;
        proxy_pass $upstream;
        proxy_set_header Host s3:8333;
        proxy_hide_header x-amz-id-2;
        proxy_hide_header x-amz-request-id;
        proxy_hide_header X-Amz-Request-Id;
    }

    location / {
        set $upstream http://web:3000;
        proxy_pass $upstream;
    }
}
