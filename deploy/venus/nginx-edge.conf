# Edge for VENUS — does what the ALB and CloudFront did on AWS.
#   manage.dupli2.com            → manage-web
#   dupli1.com, manage.dupli1.com → 308 to the same path on dupli2 (except /api/)
#   /api/*, /gateway/*           → proxy (API gateway, nginx-gateway.conf)
#   /product-images/<key>        → SeaweedFS bucket product-images (was CloudFront)
#   everything else              → web (storefront)
# Two listeners with the same routing:
#   8080  cloudflared only (TLS terminates at Cloudflare); not published on the host
#   80    direct HTTP, published on 0.0.0.0:80 for the home network
# Upstreams resolve per request so one service being down doesn't stop the
# edge from starting.

resolver 127.0.0.11 valid=10s ipv6=off;

# Cloudflare sends the client address in CF-Connecting-IP and the original
# scheme in X-Forwarded-Proto. Trust them only on the tunnel listener: on :80
# anyone can set them, and auth's login rate limit keys on the client IP.
map "$server_port:$http_cf_connecting_ip" $client_ip {
    "~^8080:(?<cf_ip>.+)$" $cf_ip;
    default                $remote_addr;
}
map "$server_port:$http_x_forwarded_proto" $client_proto {
    "~^8080:(?<cf_proto>https?)$" $cf_proto;
    default                       $scheme;
}

# The image's default "main" format plus timings, so slow-page reports can be
# checked here: rt = total request time (client's first byte to our last),
# urt/uct = upstream response/connect time. All in seconds; "-" when no
# upstream was reached. $host tells manage from storefront traffic, and
# $client_ip is the real client on the tunnel listener (see map above).
# SSE streams log once, when they close, with rt = stream lifetime.
log_format timed '$client_ip - $remote_user [$time_local] "$request" '
                 '$status $body_bytes_sent "$http_referer" '
                 '"$http_user_agent" host=$host '
                 'rt=$request_time urt=$upstream_response_time '
                 'uct=$upstream_connect_time';

proxy_set_header Host              $host;
proxy_set_header X-Real-IP         $client_ip;
proxy_set_header X-Forwarded-For   $client_ip;
proxy_set_header X-Forwarded-Proto $client_proto;
proxy_http_version 1.1;
proxy_set_header Connection        "";
client_max_body_size 20m;
server_tokens off;

server {
    listen 80;
    listen 8080;
    server_name manage.dupli2.com;
    access_log /var/log/nginx/access.log timed;

    # Unbuffered: the live order feed is Server-Sent Events via manage-web.
    # 100m: staff upload inspection videos (검수영상) through the console;
    # order caps them at 100 MB, which is also Cloudflare's per-request limit.
    location / {
        set $upstream http://manage-web:80;
        proxy_pass $upstream;
        proxy_buffering off;
        proxy_request_buffering off;
        client_max_body_size 100m;
        proxy_read_timeout 1h;
    }
}

server {
    listen 80 default_server;
    listen 8080 default_server;
    server_name dupli2.com www.dupli2.com _;
    access_log /var/log/nginx/access.log timed;

    location /api/ {
        set $upstream http://proxy:80;
        proxy_pass $upstream;
    }

    # Consultation streams (Server-Sent Events) — the shopper's web chat and
    # the staff inbox. Unbuffered like the gateway's own blocks for them, or
    # frames sit here until the buffer fills.
    location ~ ^/api/v1/support/(web|inquiries)/events$ {
        set $upstream http://proxy:80;
        proxy_pass $upstream;
        proxy_buffering off;
        proxy_read_timeout 1h;
    }

    location /gateway/ {
        set $upstream http://proxy:80;
        proxy_pass $upstream;
    }

    # Public read of product images only; the bucket itself is not listable.
    location /product-images/ {
        limit_except GET HEAD { deny all; }
        set $upstream http://s3:8333;
        proxy_pass $upstream;
        proxy_set_header Host s3:8333;
        proxy_hide_header x-amz-id-2;
        proxy_hide_header x-amz-request-id;
        proxy_hide_header X-Amz-Request-Id;
    }

    location / {
        set $upstream http://web:3000;
        proxy_pass $upstream;
    }
}

# dupli2.com replaced dupli1.com. Pages redirect (308 keeps the method, so a
# form posted from a tab left open still lands); sessions are host-scoped
# cookies, so a shopper signs in again on dupli2.com.
#
# /api/ and /gateway/ keep being served here: a NANO receiveUrl issued before
# the switch still points at dupli1.com, and NANO's approval is a form POST —
# answering it with a redirect would drop the body and strand the payment. The
# Telegram support webhook, if registered on dupli1.com, lands here too.
server {
    listen 80;
    listen 8080;
    server_name manage.dupli1.com;
    access_log /var/log/nginx/access.log timed;
    return 308 $client_proto://manage.dupli2.com$request_uri;
}

server {
    listen 80;
    listen 8080;
    server_name dupli1.com www.dupli1.com;
    access_log /var/log/nginx/access.log timed;

    location /api/ {
        set $upstream http://proxy:80;
        proxy_pass $upstream;
    }

    location /gateway/ {
        set $upstream http://proxy:80;
        proxy_pass $upstream;
    }

    location / {
        return 308 $client_proto://dupli2.com$request_uri;
    }
}
