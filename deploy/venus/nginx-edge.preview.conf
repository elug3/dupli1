# Edge for the preview stack (docker-compose.preview.yml) — nginx-edge.conf
# with the preview's hosts and upstreams. Keep the two in step.
#   manage-preview.dupli1.com    → manage-web
#   /api/*, /gateway/*           → proxy
#   /product-images/<key>        → the preview's SeaweedFS
#   everything else              → web (preview.dupli1.com)
# Listeners:
#   8080  production's cloudflared, over the production network (preview-edge:8080)
#   80    published on 127.0.0.1:8090 only, for deploy.sh's health checks
# This container is on the production network too, so every upstream is a
# preview container name: a service name (web, proxy) could resolve to
# production's container.

resolver 127.0.0.11 valid=10s ipv6=off;

map "$server_port:$http_cf_connecting_ip" $client_ip {
    "~^8080:(?<cf_ip>.+)$" $cf_ip;
    default                $remote_addr;
}
map "$server_port:$http_x_forwarded_proto" $client_proto {
    "~^8080:(?<cf_proto>https?)$" $cf_proto;
    default                       $scheme;
}

proxy_set_header Host              $host;
proxy_set_header X-Real-IP         $client_ip;
proxy_set_header X-Forwarded-For   $client_ip;
proxy_set_header X-Forwarded-Proto $client_proto;
proxy_http_version 1.1;
proxy_set_header Connection        "";
client_max_body_size 20m;
server_tokens off;

# Search engines stay out of the preview.
add_header X-Robots-Tag "noindex, nofollow" always;

server {
    listen 80;
    listen 8080;
    server_name manage-preview.dupli1.com;

    location / {
        set $upstream http://dupli1-preview-manage-web-1:80;
        proxy_pass $upstream;
        proxy_buffering off;
        proxy_read_timeout 1h;
    }
}

server {
    listen 80 default_server;
    listen 8080 default_server;
    server_name preview.dupli1.com _;

    location /api/ {
        set $upstream http://dupli1-preview-proxy-1:80;
        proxy_pass $upstream;
    }

    location ~ ^/api/v1/support/(web|inquiries)/events$ {
        set $upstream http://dupli1-preview-proxy-1:80;
        proxy_pass $upstream;
        proxy_buffering off;
        proxy_read_timeout 1h;
    }

    location /gateway/ {
        set $upstream http://dupli1-preview-proxy-1:80;
        proxy_pass $upstream;
    }

    location /product-images/ {
        limit_except GET HEAD { deny all; }
        set $upstream http://dupli1-preview-s3-1:8333;
        proxy_pass $upstream;
        proxy_set_header Host s3:8333;
        proxy_hide_header x-amz-id-2;
        proxy_hide_header x-amz-request-id;
        proxy_hide_header X-Amz-Request-Id;
    }

    location / {
        set $upstream http://dupli1-preview-web-1:3000;
        proxy_pass $upstream;
    }
}
