name: Images

# Builds every service image. Pull requests only build (a Dockerfile check);
# pushes to main, v* tags and manual runs publish to GHCR. Pushes to main then
# deploy to VENUS through the self-hosted runner there
# (docs/deployment-venus.md → "Deploying new code").
#
#   ghcr.io/elug3/dupli1-<service>:sha-<short>   every published build
#   ghcr.io/elug3/dupli1-<service>:main          latest main
#   ghcr.io/elug3/dupli1-<service>:v1.2.3        release tags
#   ghcr.io/elug3/dupli1-<service>:preview-<short>  preview/* pull requests
#
# A pull request from a preview/* branch of this repo also publishes and
# deploys to the shared preview stack (preview.dupli1.com,
# docs/deployment-preview.md); closing it puts the preview back on main.

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
    branches: [main]
    types: [opened, synchronize, reopened, closed]
  workflow_dispatch:

permissions:
  contents: read
  packages: write

jobs:
  build:
    name: Build ${{ matrix.service }}
    if: github.event.action != 'closed'
    runs-on: ubuntu-latest
    env:
      # Same-repo preview/* pull requests only: a fork's branch never reaches
      # the self-hosted runner.
      PREVIEW: ${{ github.event_name == 'pull_request' && startsWith(github.head_ref, 'preview/') && github.event.pull_request.head.repo.full_name == github.repository }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - { service: dupli1-auth,         dockerfile: Dockerfile,         build_args: SERVICE=auth }
          - { service: dupli1-notification, dockerfile: Dockerfile,         build_args: SERVICE=notification }
          - { service: dupli1-order,        dockerfile: Dockerfile,         build_args: SERVICE=order }
          - { service: dupli1-product,      dockerfile: Dockerfile,         build_args: SERVICE=product }
          - { service: dupli1-cart,         dockerfile: Dockerfile,         build_args: SERVICE=cart }
          - { service: dupli1-payment,      dockerfile: Dockerfile,         build_args: SERVICE=payment }
          - { service: dupli1-profile,      dockerfile: Dockerfile,         build_args: SERVICE=profile }
          - { service: dupli1-support,      dockerfile: Dockerfile,         build_args: SERVICE=support }
          - { service: dupli1-proxy,        dockerfile: api/Dockerfile.ecs, build_args: "" }
    steps:
      # A preview builds the branch head, the commit its deploy checks out,
      # not the merge commit pull requests build by default.
      - uses: actions/checkout@v5
        with:
          ref: ${{ env.PREVIEW == 'true' && github.event.pull_request.head.sha || '' }}

      - uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        if: github.event_name != 'pull_request' || env.PREVIEW == 'true'
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Preview tag
        id: preview
        if: env.PREVIEW == 'true'
        env:
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: echo "tag=preview-${HEAD_SHA::7}" >> "$GITHUB_OUTPUT"

      - id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/${{ github.repository_owner }}/${{ matrix.service }}
          tags: |
            type=sha,prefix=sha-
            type=ref,event=branch
            type=ref,event=tag
            type=raw,value=${{ steps.preview.outputs.tag }},enable=${{ env.PREVIEW == 'true' }}

      - uses: docker/build-push-action@v6
        with:
          context: .
          file: ${{ matrix.dockerfile }}
          build-args: ${{ matrix.build_args }}
          push: ${{ github.event_name != 'pull_request' || env.PREVIEW == 'true' }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha,scope=${{ matrix.service }}
          cache-to: type=gha,mode=max,scope=${{ matrix.service }}

  # Runs on VENUS itself (self-hosted runner, label "venus"), so nothing needs
  # an inbound port. main pushes only — never pull requests: this repo is
  # public, and fork PRs need maintainer approval before any job runs.
  deploy:
    name: Deploy to VENUS
    needs: build
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: [self-hosted, venus]
    environment: production
    concurrency:
      group: venus-deploy
      cancel-in-progress: false
    permissions:
      contents: read
      packages: read
    env:
      DEPLOY_DIR: /opt/dupli1/repo
    steps:
      # Only the script, into the job's workspace. deploy.sh moves the deploy
      # checkout itself, under the lock the frontend deploys take too, so a
      # web deploy can't read the compose file while this one changes it.
      - uses: actions/checkout@v5
        with:
          sparse-checkout: deploy/venus/deploy.sh
          sparse-checkout-cone-mode: false

      - name: Log in to GHCR
        env:
          DOCKER_CONFIG: ${{ runner.temp }}/docker
          GHCR_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: echo "$GHCR_TOKEN" | docker login ghcr.io -u "$GITHUB_ACTOR" --password-stdin

      - name: Deploy
        env:
          DOCKER_CONFIG: ${{ runner.temp }}/docker
          GHCR_OWNER: ${{ github.repository_owner }}
        run: deploy/venus/deploy.sh --ref "$GITHUB_SHA" "sha-${GITHUB_SHA::7}"

      - name: Log out of GHCR
        if: always()
        env:
          DOCKER_CONFIG: ${{ runner.temp }}/docker
        run: rm -rf "$DOCKER_CONFIG"

  # The shared preview stack on VENUS (docs/deployment-preview.md). Same
  # runner as production, but its own compose project, data and secrets, and
  # it never touches /opt/dupli1. Only preview/* branches of this repo: a
  # fork's pull request never gets here.
  preview:
    name: Deploy to preview
    needs: build
    if: >-
      github.event_name == 'pull_request' && github.event.action != 'closed' &&
      startsWith(github.head_ref, 'preview/') &&
      github.event.pull_request.head.repo.full_name == github.repository
    runs-on: [self-hosted, venus]
    environment:
      name: preview
      url: https://preview.dupli1.com
    concurrency:
      group: venus-preview-backend
      cancel-in-progress: false
    permissions:
      contents: read
      packages: read
    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          sparse-checkout: |
            deploy/venus/deploy.sh
            deploy/venus/preview.sh
          sparse-checkout-cone-mode: false

      - name: Log in to GHCR
        env:
          DOCKER_CONFIG: ${{ runner.temp }}/docker
          GHCR_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: echo "$GHCR_TOKEN" | docker login ghcr.io -u "$GITHUB_ACTOR" --password-stdin

      - name: Deploy
        env:
          DOCKER_CONFIG: ${{ runner.temp }}/docker
          GHCR_OWNER: ${{ github.repository_owner }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          PR: ${{ github.event.pull_request.number }}
        run: deploy/venus/preview.sh deploy backend "preview-${HEAD_SHA::7}" --pr "$PR" --ref "$HEAD_SHA"

      - name: Log out of GHCR
        if: always()
        env:
          DOCKER_CONFIG: ${{ runner.temp }}/docker
        run: rm -rf "$DOCKER_CONFIG"

  # Closing (or merging) the pull request puts the preview's backend back on
  # main, unless a newer preview PR has deployed since.
  preview-reset:
    name: Reset preview
    if: >-
      github.event_name == 'pull_request' && github.event.action == 'closed' &&
      startsWith(github.head_ref, 'preview/') &&
      github.event.pull_request.head.repo.full_name == github.repository
    runs-on: [self-hosted, venus]
    environment: preview
    concurrency:
      group: venus-preview-backend
      cancel-in-progress: false
    permissions:
      contents: read
      packages: read
    steps:
      # main's scripts, not the closed branch's.
      - uses: actions/checkout@v5
        with:
          ref: main
          sparse-checkout: |
            deploy/venus/deploy.sh
            deploy/venus/preview.sh
          sparse-checkout-cone-mode: false

      - name: Log in to GHCR
        env:
          DOCKER_CONFIG: ${{ runner.temp }}/docker
          GHCR_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: echo "$GHCR_TOKEN" | docker login ghcr.io -u "$GITHUB_ACTOR" --password-stdin

      - name: Reset
        env:
          DOCKER_CONFIG: ${{ runner.temp }}/docker
          GHCR_OWNER: ${{ github.repository_owner }}
          PR: ${{ github.event.pull_request.number }}
        run: deploy/venus/preview.sh reset backend --pr "$PR"

      - name: Log out of GHCR
        if: always()
        env:
          DOCKER_CONFIG: ${{ runner.temp }}/docker
        run: rm -rf "$DOCKER_CONFIG"
