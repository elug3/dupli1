name: Images

# Builds every service image. Pull requests only build (a Dockerfile check);
# pushes to main, v* tags and manual runs publish to GHCR. Pushes to main then
# deploy to VENUS through the self-hosted runner there
# (docs/deployment-venus.md → "Deploying new code").
#
#   ghcr.io/elug3/dupli1-<service>:sha-<short>   every published build
#   ghcr.io/elug3/dupli1-<service>:main          latest main
#   ghcr.io/elug3/dupli1-<service>:v1.2.3        release tags

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  packages: write

jobs:
  build:
    name: Build ${{ matrix.service }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - { service: dupli1-auth,         dockerfile: Dockerfile,         build_args: SERVICE=auth }
          - { service: dupli1-notification, dockerfile: Dockerfile,         build_args: SERVICE=notification }
          - { service: dupli1-order,        dockerfile: Dockerfile,         build_args: SERVICE=order }
          - { service: dupli1-product,      dockerfile: Dockerfile,         build_args: SERVICE=product }
          - { service: dupli1-cart,         dockerfile: Dockerfile,         build_args: SERVICE=cart }
          - { service: dupli1-payment,      dockerfile: Dockerfile,         build_args: SERVICE=payment }
          - { service: dupli1-profile,      dockerfile: Dockerfile,         build_args: SERVICE=profile }
          - { service: dupli1-support,      dockerfile: Dockerfile,         build_args: SERVICE=support }
          - { service: dupli1-proxy,        dockerfile: api/Dockerfile.ecs, build_args: "" }
    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        if: github.event_name != 'pull_request'
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/${{ github.repository_owner }}/${{ matrix.service }}
          tags: |
            type=sha,prefix=sha-
            type=ref,event=branch
            type=ref,event=tag

      - uses: docker/build-push-action@v6
        with:
          context: .
          file: ${{ matrix.dockerfile }}
          build-args: ${{ matrix.build_args }}
          push: ${{ github.event_name != 'pull_request' }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha,scope=${{ matrix.service }}
          cache-to: type=gha,mode=max,scope=${{ matrix.service }}

  # Runs on VENUS itself (self-hosted runner, label "venus"), so nothing needs
  # an inbound port. main pushes only — never pull requests: this repo is
  # public, and fork PRs need maintainer approval before any job runs.
  deploy:
    name: Deploy to VENUS
    needs: build
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: [self-hosted, venus]
    environment: production
    concurrency:
      group: venus-deploy
      cancel-in-progress: false
    permissions:
      contents: read
      packages: read
    env:
      DEPLOY_DIR: /opt/dupli1/repo
    steps:
      - name: Check out ${{ github.sha }} in the deploy checkout
        run: |
          git -C "$DEPLOY_DIR" fetch --depth 1 origin "$GITHUB_SHA"
          git -C "$DEPLOY_DIR" checkout --detach FETCH_HEAD

      - name: Log in to GHCR
        env:
          DOCKER_CONFIG: ${{ runner.temp }}/docker
          GHCR_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: echo "$GHCR_TOKEN" | docker login ghcr.io -u "$GITHUB_ACTOR" --password-stdin

      - name: Deploy
        env:
          DOCKER_CONFIG: ${{ runner.temp }}/docker
          GHCR_OWNER: ${{ github.repository_owner }}
        run: '"$DEPLOY_DIR/deploy/venus/deploy.sh" "sha-${GITHUB_SHA::7}"'

      - name: Log out of GHCR
        if: always()
        env:
          DOCKER_CONFIG: ${{ runner.temp }}/docker
        run: rm -rf "$DOCKER_CONFIG"
