# Local docker-compose gateway (dupli1-proxy). Routes live in
# api/gateway/routes.conf; this file holds only what is local.
#
# Resolve upstreams via Docker's embedded DNS only — the AWS VPC Route53
# resolver (10.0.0.2) is unreachable here, and listing it made nginx
# round-robin onto a dead resolver, yielding intermittent SERVFAIL -> 502
# "bad gateway". Variable proxy_pass re-resolves hostnames when containers
# restart.
resolver 127.0.0.11 valid=10s ipv6=off;

server {
    listen 80;
    server_name manage.dupli1.local;

    set $manage_upstream manage.dupli1.internal:3000;

    proxy_set_header Host              $host;
    proxy_set_header X-Real-IP         $remote_addr;
    proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;

    location / {
        proxy_pass http://$manage_upstream;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
    }
}

server {
    listen 80 default_server;
    # Internal listener: service-to-service only (order → product internal APIs).
    listen 8081;

    # Compose service names.
    set $gw_auth         http://dupli1-auth:8080;
    set $gw_product      http://dupli1-product:8080;
    set $gw_order        http://dupli1-order:8080;
    set $gw_cart         http://dupli1-cart:8080;
    set $gw_payment      http://dupli1-payment:8080;
    set $gw_notification http://dupli1-notification:8080;
    set $gw_support      http://dupli1-support:8080;
    set $gw_profile      http://dupli1-profile:8080;

    include /etc/nginx/dupli1/routes.conf;

    location /product-images/ {
        set $upstream http://minio:9000;
        proxy_pass $upstream;
    }
}
