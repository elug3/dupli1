# Gateway config baked into the proxy image (api/Dockerfile.ecs) — AWS ECS,
# where upstreams are Cloud Map A records in the dupli1.local namespace.
# Routes live in api/gateway/routes.conf. deploy/venus/nginx-gateway.conf is
# the same file with Docker's resolver.
resolver 10.0.0.2 valid=10s ipv6=off;

server {
    listen 80 default_server;
    # Internal listener: service-to-service only (order → product internal APIs).
    listen 8081;

    include /etc/nginx/dupli1/hosts.dupli1.local.conf;
    include /etc/nginx/dupli1/routes.conf;

    # Product images are NOT proxied here. The S3 bucket is private; browsers
    # load imageUrls from CloudFront (OAC). See docs/product-images-browser-access.md.
}

# Public storefront is the ALB default target (dupli1-web on host:3000).
# Admin UI is VPN/private-DNS only at http://manage.dupli1.local — not on this ALB.
