# Upstreams by Cloud Map name (dupli1.local private namespace on AWS; Docker
# network aliases of the same names on VENUS). Shared by api/nginx.ecs.conf and
# deploy/venus/nginx-gateway.conf. Installed at /etc/nginx/dupli1/.
set $gw_auth         http://auth.dupli1.local:8080;
set $gw_product      http://product.dupli1.local:8080;
set $gw_order        http://order.dupli1.local:8080;
set $gw_cart         http://cart.dupli1.local:8080;
set $gw_payment      http://payment.dupli1.local:8080;
set $gw_notification http://notification.dupli1.local:8080;
set $gw_support      http://support.dupli1.local:8080;
set $gw_profile      http://profile.dupli1.local:8080;
