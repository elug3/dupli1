# Dupli1 API gateway — the one route table every environment shares.
#
# Included inside each environment's `server { }` by its wrapper:
#   api/nginx.conf                   local Compose
#   api/nginx.ecs.conf               the proxy image (AWS ECS)
#   deploy/venus/nginx-gateway.conf  production on VENUS
#   api/nginx.prod.conf              single-EC2 Compose
# and installed in every proxy image at /etc/nginx/dupli1/routes.conf (not
# conf.d/, which nginx would load at http level).
#
# A wrapper owns only what differs per environment: `resolver`, the listeners
# (80 public, 8081 internal — the internal-API rule below depends on 8081),
# extra server blocks or locations, and the upstream of each service as a
# variable:
#   $gw_auth $gw_product $gw_order $gw_cart $gw_payment
#   $gw_notification $gw_support $gw_profile
# Add or change a route here, once. api/gateway/test.sh checks every wrapper
# against this file (CI: .github/workflows/test.yml → gateway).

client_max_body_size 20m;

proxy_set_header Host              $host;
proxy_set_header X-Real-IP         $remote_addr;
proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
proxy_set_header X-Forwarded-Proto $scheme;

error_page 400 = @error_400;
error_page 401 = @error_401;
error_page 403 = @error_403;
error_page 404 = @error_404;
error_page 405 = @error_405;
error_page 408 = @error_408;
error_page 413 = @error_413;
error_page 429 = @error_429;
error_page 500 = @error_500;
error_page 502 = @error_502;
error_page 503 = @error_503;
error_page 504 = @error_504;

location @error_400 { default_type application/json; return 400 '{"error":"bad request"}'; }
location @error_401 { default_type application/json; return 401 '{"error":"unauthorized"}'; }
location @error_403 { default_type application/json; return 403 '{"error":"forbidden"}'; }
location @error_404 { default_type application/json; return 404 '{"error":"not found"}'; }
location @error_405 { default_type application/json; return 405 '{"error":"method not allowed"}'; }
location @error_408 { default_type application/json; return 408 '{"error":"request timeout"}'; }
location @error_413 { default_type application/json; return 413 '{"error":"payload too large"}'; }
location @error_429 { default_type application/json; return 429 '{"error":"too many requests"}'; }
location @error_500 { default_type application/json; return 500 '{"error":"internal server error"}'; }
location @error_502 { default_type application/json; return 502 '{"error":"bad gateway"}'; }
location @error_503 { default_type application/json; return 503 '{"error":"service unavailable"}'; }
location @error_504 { default_type application/json; return 504 '{"error":"gateway timeout"}'; }

location = /gateway/health {
    default_type application/json;
    return 200 '{"status":"ok"}';
}

# Internal APIs — only dupli1-order calls these, and only on the internal
# listener (8081), which nothing public routes to. The public listener (80:
# the edge on VENUS, the ALB on AWS, the host's :8080 locally) answers 404, so
# they are not reachable from outside at all; product still checks the caller
# is dupli1-order (docs/permissions.md → Internal APIs). A regex location wins
# over the prefix locations below and matches nginx's decoded, normalized
# URI, so %-encoding, // or ../ cannot slip past it.
location ~* ^/api/v1/((products/)?inventory/reservations|products/promotions/(reserve|consume|release|tier))(/|$) {
    if ($server_port != 8081) {
        return 404;
    }
    proxy_pass $gw_product;
}

# Service-account API key exchange (docs/auth-service-api-keys.md). Same rule:
# only machines inside call it, on the internal listener, so a leaked key is
# useless from outside.
location ~* ^/api/v1/auth/token(/|$) {
    if ($server_port != 8081) {
        return 404;
    }
    proxy_pass $gw_auth;
}

location /api/v1/auth/ {
    proxy_pass $gw_auth;
}

location /api/v1/profile {
    proxy_pass $gw_profile;
}

# One-release aliases — clients still calling auth-hosted paths.
location /api/v1/auth/me/profile {
    proxy_pass $gw_profile;
}

location /api/v1/auth/me/addresses {
    proxy_pass $gw_profile;
}

location /api/v1/products {
    proxy_pass $gw_product;
}

location /api/v1/catalog {
    proxy_pass $gw_product;
}

location /api/v1/variants {
    proxy_pass $gw_product;
}

location /api/v1/promotions {
    proxy_pass $gw_product;
}

# Pre-rename spelling; retires with the other legacy prefixes.
# See docs/product-promotion-rename.md.
location /api/v1/coupons {
    proxy_pass $gw_product;
}

location /api/v1/inventory/ {
    proxy_pass $gw_product;
}

# Live order stream for manage-web (Server-Sent Events, order.read.all).
# Unbuffered so each event reaches the console as it happens; order also
# sends X-Accel-Buffering: no, this just does not depend on it. The default
# 60s read timeout stays: order sends a heartbeat every 20s. No
# proxy_set_header here — one would drop every header inherited from above.
location = /api/v1/orders/events {
    proxy_pass $gw_order;
    proxy_buffering off;
    proxy_cache off;
}

location /api/v1/orders {
    proxy_pass $gw_order;
}

location /api/v1/checkout {
    proxy_pass $gw_order;
}

location /api/v1/cart {
    proxy_pass $gw_cart;
}

location /api/v1/carts/ {
    proxy_pass $gw_cart;
}

location /api/v1/payments {
    proxy_pass $gw_payment;
}

location /api/v1/payments/ {
    proxy_pass $gw_payment;
}

location /api/v1/notification/ {
    proxy_pass $gw_notification;
}

# Telegram posts the customer bot's updates to
# /api/v1/support/telegram/webhook through the public entry, so a missing
# block here is not a dead admin tab but a dead bot: Telegram gets a 404
# and retries into nothing.
location /api/v1/support/ {
    proxy_pass $gw_support;
}
