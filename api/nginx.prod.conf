# Single-EC2 Compose gateway (docker-compose.prod.yml, api/Dockerfile.prod).
# Routes live in api/gateway/routes.conf. Upstreams are static groups, so
# nginx resolves them once at start; `proxy_pass $gw_*` finds a group of that
# name before it would ever need a resolver.

upstream dupli1_auth {
    server dupli1-auth:8080;
}

upstream dupli1_product {
    server dupli1-product:8080;
}

upstream dupli1_order {
    server dupli1-order:8080;
}

upstream dupli1_cart {
    server dupli1-cart:8080;
}

upstream dupli1_payment {
    server dupli1-payment:8080;
}

upstream dupli1_notification {
    server dupli1-notification:8080;
}

upstream dupli1_support {
    server dupli1-support:8080;
}

upstream dupli1_profile {
    server dupli1-profile:8080;
}

upstream dupli1_minio {
    server minio:9000;
}

# Optional: uncomment when dupli1-manage-web is added to docker-compose.prod.yml
# upstream dupli1_manage_web {
#     server dupli1-manage-web:3000;
# }

server {
    listen 80;
    # Internal listener: service-to-service only (order → product internal APIs).
    listen 8081;

    set $gw_auth         http://dupli1_auth;
    set $gw_product      http://dupli1_product;
    set $gw_order        http://dupli1_order;
    set $gw_cart         http://dupli1_cart;
    set $gw_payment      http://dupli1_payment;
    set $gw_notification http://dupli1_notification;
    set $gw_support      http://dupli1_support;
    set $gw_profile      http://dupli1_profile;

    include /etc/nginx/dupli1/routes.conf;

    location /product-images/ {
        proxy_pass http://dupli1_minio;
    }
}
