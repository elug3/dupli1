openapi: 3.0.3
info:
  title: Dupli1 Auth API
  version: v1
  description: |
    Private authentication and user administration API for the Dupli1 marketplace.

    **Token flow**
    1. `POST /login` → `refresh_token` (RS256 JWT, ~24h)
    2. `POST /refresh` → `token` (access JWT, ~15min) + a rotated `refresh_token`; the token
       sent in the request is invalidated immediately, so the caller must store the new one
    3. Send `Authorization: Bearer <token>` on protected routes

    Access tokens are RS256 JWTs verifiable via `GET /.well-known/jwks.json`.

    **Authorization:** fine-grained permission strings in the `permissions` claim, not roles.
    Each protected operation lists what it needs in `x-required-permissions`; ABAC additionally
    prevents managing an account at or above the caller's own tier. See docs/permissions.md.

servers:
  - url: http://localhost:8080
    description: Local nginx gateway
  - url: http://localhost:18080
    description: Direct dupli1-auth service

tags:
  - name: Health
  - name: Settings
  - name: Tokens
  - name: Users

paths:
  /api/v1/auth/health:
    get:
      tags: [Health]
      summary: Service health check
      operationId: authHealth
      responses:
        '200':
          description: Service is healthy
          content:
            application/json:
              schema:
                type: object
                required: [status]
                properties:
                  status:
                    type: string
                    example: ok

  /api/v1/auth/settings:
    get:
      tags: [Settings]
      summary: Non-secret service settings
      operationId: authSettings
      responses:
        '200':
          description: Safe operational settings
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Settings'

  /api/v1/auth/.well-known/jwks.json:
    get:
      tags: [Tokens]
      summary: JSON Web Key Set for access token verification
      operationId: authJWKS
      responses:
        '200':
          description: JWKS document
          content:
            application/json:
              schema:
                type: object
                required: [keys]
                properties:
                  keys:
                    type: array
                    items:
                      type: object
        '404':
          description: JWKS not configured (test-only edge case)

  /api/v1/auth/login:
    post:
      tags: [Tokens]
      summary: Authenticate and receive a refresh token
      operationId: authLogin
      description: Rate limited to 10 requests per 60 seconds per client IP when Redis is available.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/LoginRequest'
      responses:
        '200':
          description: Login successful
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RefreshTokenResponse'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          description: Account locked or deactivated
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '429':
          description: Rate limit exceeded
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '500':
          $ref: '#/components/responses/InternalError'

  /api/v1/auth/refresh:
    post:
      tags: [Tokens]
      summary: Exchange refresh token for access token
      operationId: authRefresh
      description: |
        Rate limited to 30 requests per 60 seconds per client IP when Redis is available.
        The refresh token rotates on every call: the token in the request is invalidated
        immediately and the response carries its replacement. Reusing an already-rotated
        (or otherwise revoked) refresh token, or one for a deactivated/locked account,
        returns 401.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RefreshRequest'
      responses:
        '200':
          description: New access token issued
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AccessTokenResponse'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '429':
          description: Rate limit exceeded
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'

  /api/v1/auth/logout:
    post:
      tags: [Tokens]
      summary: Revoke a refresh token
      operationId: authLogout
      description: |
        Authenticates via `refresh_token` in the request body (no Bearer header).
        Access tokens remain valid until they expire.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RefreshRequest'
      responses:
        '204':
          description: Logout successful
        '400':
          $ref: '#/components/responses/BadRequest'
        '500':
          $ref: '#/components/responses/InternalError'

  /api/v1/auth/register:
    post:
      tags: [Users]
      summary: Create a new user account
      operationId: authRegister
      security:
        - bearerAuth: []
      description: >
        Requires `user.create` (or temporary open register). New users receive empty
        permissions by default and `account_type` `customer` unless overridden with
        `customer` | `manager` | `service` (never `admin` — that is a permission).
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RegisterRequest'
      responses:
        '201':
          description: User created
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RegisterResponse'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          description: Insufficient permission
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '409':
          description: Email already registered
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '422':
          description: Invalid email or weak password
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '500':
          $ref: '#/components/responses/InternalError'

  /api/v1/auth/me:
    get:
      tags: [Users]
      summary: Get authenticated user profile
      operationId: authMe
      security:
        - bearerAuth: []
      responses:
        '200':
          description: Current user profile
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/User'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '500':
          $ref: '#/components/responses/InternalError'

  /api/v1/auth/users:
    get:
      tags: [Users]
      summary: List all users
      operationId: authListUsers
      security:
        - bearerAuth: []
      x-required-permissions: [user.read]
      responses:
        '200':
          description: User list
          content:
            application/json:
              schema:
                type: object
                required: [users]
                properties:
                  users:
                    type: array
                    items:
                      $ref: '#/components/schemas/User'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          description: Missing `user.read`
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '500':
          $ref: '#/components/responses/InternalError'

  /api/v1/auth/users/{id}/permissions:
    patch:
      tags: [Users]
      summary: Replace a user's permissions
      operationId: authSetUserPermissions
      security:
        - bearerAuth: []
      x-required-permissions: [user.permissions.update]
      description: |
        Replaces the permission set wholesale; `permissions` must be non-empty.
        ABAC additionally prevents managing an account at or above the caller's tier.
      parameters:
        - $ref: '#/components/parameters/UserId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [permissions]
              properties:
                permissions:
                  type: array
                  minItems: 1
                  items:
                    type: string
                  example: [product.create, product.update]
                account_type:
                  type: string
                  enum: [customer, manager, service]
                  description: >
                    Optional. Updates the user's account_type. Use `manager` for operators;
                    `admin` is a permission (`admin.*`), not an account_type.
      responses:
        '200':
          description: Updated user
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/User'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          description: Missing `user.permissions.update`, or ABAC forbids managing this account
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '404':
          $ref: '#/components/responses/NotFound'
        '422':
          description: Invalid account_type or unknown permission string
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '500':
          $ref: '#/components/responses/InternalError'

  /api/v1/auth/users/{id}/password:
    patch:
      tags: [Users]
      summary: Set a user's password
      operationId: authUpdateUserPassword
      security:
        - bearerAuth: []
      x-required-permissions: [user.password.update]
      parameters:
        - $ref: '#/components/parameters/UserId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [password]
              properties:
                password:
                  type: string
                  minLength: 8
      responses:
        '204':
          description: Password updated
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          description: Insufficient permission
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '404':
          $ref: '#/components/responses/NotFound'
        '422':
          description: Password too short
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '500':
          $ref: '#/components/responses/InternalError'

  /api/v1/auth/users/{id}/status:
    patch:
      tags: [Users]
      summary: Activate or deactivate a user
      operationId: authSetUserStatus
      security:
        - bearerAuth: []
      x-required-permissions: [user.status.update]
      parameters:
        - $ref: '#/components/parameters/UserId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                is_active:
                  type: boolean
                  default: false
      responses:
        '200':
          description: Updated user
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/User'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          description: Insufficient permission
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '404':
          $ref: '#/components/responses/NotFound'
        '500':
          $ref: '#/components/responses/InternalError'

components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
      description: |
        RS256 access token from POST /api/v1/auth/refresh. Every request re-checks
        the account: a still-unexpired token for a since-deactivated or since-locked
        account is rejected with 403 (not just 401), on any bearer-protected endpoint.

  parameters:
    UserId:
      name: id
      in: path
      required: true
      schema:
        type: string
      description: Target user UUID

  schemas:
    Error:
      type: object
      required: [error]
      properties:
        error:
          type: string

    Settings:
      type: object
      required: [service, api_version]
      properties:
        service:
          type: string
          example: auth
        api_version:
          type: string
          example: v1
        auth:
          type: object
          properties:
            mode:
              type: string
              example: rs256
            jwks_configured:
              type: boolean
            jwt_secret_fallback:
              type: boolean
        storage:
          type: string
          example: postgres
        features:
          type: object
          additionalProperties:
            type: boolean
        limits:
          type: object
          additionalProperties: true
        dependencies:
          type: object
          additionalProperties:
            type: object
            properties:
              configured:
                type: boolean
              host:
                type: string

    LoginRequest:
      type: object
      required: [email, password]
      properties:
        email:
          type: string
          format: email
        password:
          type: string

    RegisterRequest:
      type: object
      required: [email, password]
      properties:
        email:
          type: string
          format: email
        password:
          type: string
          minLength: 8
        account_type:
          type: string
          enum: [customer, manager, service]
          default: customer
          description: >
            Account classification (not a permission). Use `manager` for human operators.
            `admin` is a permission tier (`admin.*`), not an account_type.
            `customer_registrar` / `user.create`-only callers may only use `customer`.

    RegisterResponse:
      type: object
      required: [user_id]
      properties:
        user_id:
          type: string
          format: uuid

    RefreshRequest:
      type: object
      required: [refresh_token]
      properties:
        refresh_token:
          type: string

    RefreshTokenResponse:
      type: object
      required: [refresh_token]
      properties:
        refresh_token:
          type: string

    AccessTokenResponse:
      type: object
      required: [token, refresh_token]
      properties:
        token:
          type: string
        refresh_token:
          type: string
          description: >-
            Rotated replacement for the refresh token sent in the request.
            The one sent is invalidated immediately; store this one for the
            next refresh call.

    User:
      type: object
      required: [user_id, email, account_type, permissions, is_active, failed_login_attempts]
      properties:
        user_id:
          type: string
          format: uuid
        email:
          type: string
          format: email
        account_type:
          type: string
          enum: [customer, manager, service]
          description: Account classification. Not a permission — use `manager` for operators (`admin.*` is a permission).
        permissions:
          type: array
          items:
            type: string
          description: Fine-grained permission strings (e.g. product.create, admin.*, *)
        is_active:
          type: boolean
        locked_at:
          type: string
          format: date-time
          nullable: true
        failed_login_attempts:
          type: integer

  responses:
    BadRequest:
      description: Invalid request body
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
    Unauthorized:
      description: Missing, invalid, or expired token
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
    NotFound:
      description: Resource not found
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
    InternalError:
      description: Internal server error
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
