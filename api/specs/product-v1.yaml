openapi: 3.0.3
info:
  title: Dupli1 Product API
  version: v1
  description: |
    Product catalog, variants, coupons, stock and SKU master data for the Dupli1 marketplace.
    Stock and reservations were merged into this service from the former standalone inventory
    service.

    Protected routes require a Bearer access token (RS256 via auth JWKS when AUTH_JWKS_URL is set,
    or HS256 via JWT_SECRET in dev). The token must include claim "type": "access".

    **Authorization:** fine-grained permission strings, not roles — e.g. `product.create`,
    `product.master.write`, `coupon.update`, `inventory.stock.write`,
    `inventory.reservation.manage`. A valid token without the required permission gets `403`.
    Each operation below lists what it needs in `x-required-permissions`.

    **Paths:** every route is namespaced under `/api/v1/products/…`. The older top-level
    prefixes `/api/v1/variants`, `/api/v1/coupons`, `/api/v1/catalog` and `/api/v1/inventory`
    remain registered as aliases with identical contracts and will be removed once clients
    migrate; only the canonical paths are documented here except where a legacy path is
    listed explicitly.

servers:
  - url: http://localhost:8080
    description: Local nginx gateway
  - url: http://localhost:8081
    description: Direct dupli1-product service

tags:
  - name: Health
  - name: Settings
  - name: Products
  - name: Coupons
  - name: Inventory
  - name: Catalog

paths:
  /api/v1/products/health:
    get:
      tags: [Health]
      summary: Service health check
      operationId: productHealth
      responses:
        '200':
          description: Service is healthy
          content:
            application/json:
              schema:
                type: object
                required: [status]
                properties:
                  status:
                    type: string
                    example: ok

  /api/v1/products/settings:
    get:
      tags: [Settings]
      summary: Non-secret service settings
      operationId: productSettings
      responses:
        '200':
          description: Safe operational settings
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Settings'

  /api/v1/products/inventory/health:
    get:
      tags: [Health]
      summary: Inventory health check (same product service process)
      operationId: inventoryHealth
      responses:
        '200':
          description: Service is healthy
          content:
            application/json:
              schema:
                type: object
                required: [status]
                properties:
                  status:
                    type: string
                    example: ok

  /api/v1/products/inventory/settings:
    get:
      tags: [Settings]
      summary: Non-secret service settings (product service)
      operationId: inventorySettings
      responses:
        '200':
          description: Safe operational settings
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Settings'

  /api/v1/products/{id}:
    get:
      tags: [Products]
      summary: Get public product detail
      operationId: productPublicGet
      description: |
        Returns an active parent style with variants, availableColors, and availableSizes.
        Ensures a `dupli1_guest` HttpOnly cookie and records a unique view (one count per
        guest × product). Response includes public `viewCount` and `soldCount`. View-store
        failures do not fail the PDP.
      parameters:
        - $ref: '#/components/parameters/ProductId'
      responses:
        '200':
          description: Product detail
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PublicProduct'
          headers:
            Set-Cookie:
              description: Set when minting or replacing an invalid `dupli1_guest` cookie
              schema:
                type: string
        '400':
          $ref: '#/components/responses/BadRequest'
        '404':
          $ref: '#/components/responses/NotFound'
    put:
      tags: [Products]
      summary: Update a product
      operationId: productUpdate
      security:
        - bearerAuth: []
      parameters:
        - $ref: '#/components/parameters/ProductId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ProductInput'
      responses:
        '200':
          description: Updated product
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Product'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '500':
          $ref: '#/components/responses/InternalError'
    delete:
      tags: [Products]
      summary: Delete a product
      operationId: productDelete
      security:
        - bearerAuth: []
      parameters:
        - $ref: '#/components/parameters/ProductId'
      responses:
        '204':
          description: Product deleted
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '500':
          $ref: '#/components/responses/InternalError'

  /api/v1/products/{id}/recommendations:
    get:
      tags: [Products]
      summary: Related products for PDP
      operationId: productRecommendations
      description: |
        Returns ordered active parent product cards related to the seed id (seed excluded).
        Ranking uses same-category content similarity (brand, material, tags, price band)
        plus a soft `viewCount` boost. See docs/product-recommendations.md.
      parameters:
        - $ref: '#/components/parameters/ProductId'
        - name: limit
          in: query
          schema:
            type: integer
            minimum: 1
            maximum: 24
            default: 8
          description: Max items to return (clamped 1–24)
      responses:
        '200':
          description: Recommendation list
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RecommendationsResponse'
        '400':
          $ref: '#/components/responses/BadRequest'
        '404':
          $ref: '#/components/responses/NotFound'

  /api/v1/products/wishlist:
    get:
      tags: [Products]
      summary: List wishlisted products for current owner
      operationId: productWishlistList
      description: |
        Returns public parent cards wishlisted by the current owner (JWT `sub` when
        authenticated, otherwise `dupli1_guest` cookie).
      responses:
        '200':
          description: Wishlist items
          content:
            application/json:
              schema:
                type: object
                required: [items]
                properties:
                  items:
                    type: array
                    items:
                      $ref: '#/components/schemas/PublicProduct'
        '401':
          $ref: '#/components/responses/Unauthorized'

  /api/v1/products/{id}/wishlist:
    put:
      tags: [Products]
      summary: Add product to wishlist
      operationId: productWishlistAdd
      description: |
        Idempotent add. Owner is JWT `sub` or guest cookie. Increments public `wishlistCount`
        only on first add for that owner × product.
      parameters:
        - $ref: '#/components/parameters/ProductId'
      responses:
        '200':
          description: Wishlist state
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/WishlistMutationResponse'
        '404':
          $ref: '#/components/responses/NotFound'
    post:
      tags: [Products]
      summary: Add product to wishlist (alias of PUT)
      operationId: productWishlistAddPost
      parameters:
        - $ref: '#/components/parameters/ProductId'
      responses:
        '200':
          description: Wishlist state
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/WishlistMutationResponse'
        '404':
          $ref: '#/components/responses/NotFound'
    delete:
      tags: [Products]
      summary: Remove product from wishlist
      operationId: productWishlistRemove
      parameters:
        - $ref: '#/components/parameters/ProductId'
      responses:
        '200':
          description: Wishlist state
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/WishlistMutationResponse'

  /api/v1/products:
    get:
      tags: [Products]
      summary: Search products
      operationId: productSearch
      description: |
        Returns parent styles only (no color duplicates).
        Public callers receive active parents only.
        Authenticated managers (`product_manager`, `admin`, `owner`) receive all statuses.
      parameters:
        - name: q
          in: query
          schema:
            type: string
          description: Case-insensitive substring match on name, brand, or description
        - name: category
          in: query
          schema:
            type: string
          description: Exact match (e.g. bags)
        - name: brand
          in: query
          schema:
            type: string
          description: Case-insensitive substring match
        - name: color
          in: query
          schema:
            type: string
          description: Parent has an active variant with this color
        - name: size
          in: query
          schema:
            type: string
          description: Parent has an active variant with this size
        - name: material
          in: query
          schema:
            type: string
          description: Exact match
        - name: subcategory
          in: query
          schema:
            type: string
            enum: [handbags, tote, shoulder, cross, mini]
          description: Bag subcategory (alias subCategory)
        - name: style
          in: query
          schema:
            type: string
            enum: [casual, evening, business, weekend, statement]
          description: Bag occasion/look (not SKU styleCode)
        - name: target
          in: query
          schema:
            type: string
            enum: [all, men, women, kids]
          description: >
            Exact audience code stored on the product. Omit the param to leave
            target unfiltered (sending target=all matches products tagged all,
            not every audience).
        - name: tags
          in: query
          schema:
            type: string
          description: Comma-separated tags; product must include all
        - name: status
          in: query
          schema:
            type: string
          description: Exact match (managers only)
        - name: sort
          in: query
          schema:
            type: string
            enum: [newest, views, sold, wishlist, price, name]
            default: newest
          description: >
            Sort key. Aliases: popular→views. Default newest (created_at).
        - name: order
          in: query
          schema:
            type: string
            enum: [asc, desc]
          description: >
            Sort direction. Default desc for newest/views/sold/wishlist/price; asc for name.
        - name: period
          in: query
          schema:
            type: string
            enum: [day, week, month]
          description: >
            Only parents created within this window (from request time).
            Aliases: 7d / past_week → week; 1d → day; 30d / past_month → month.
        - name: limit
          in: query
          schema:
            type: integer
            default: 50
            maximum: 100
        - name: offset
          in: query
          schema:
            type: integer
            default: 0
      responses:
        '200':
          description: Search results
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ProductSearchResponse'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '500':
          $ref: '#/components/responses/InternalError'
    post:
      tags: [Products]
      summary: Create a product
      operationId: productCreate
      security:
        - bearerAuth: []
      description: Auto-generates `id` from brand prefix if omitted. Defaults `status` to `active`.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ProductInput'
      responses:
        '201':
          description: Product created
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Product'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '500':
          $ref: '#/components/responses/InternalError'

  /api/v1/products/{id}/images:
    post:
      tags: [Products]
      summary: Upload image to default variant
      operationId: productUploadImage
      security:
        - bearerAuth: []
      description: Multipart upload to the default variant. Prefer variant image upload for multi-color products.
      parameters:
        - $ref: '#/components/parameters/ProductId'
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              required: [image]
              properties:
                image:
                  type: string
                  format: binary
      responses:
        '201':
          description: Parent product with updated variants
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Product'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '500':
          $ref: '#/components/responses/InternalError'

  /api/v1/products/variants:
    get:
      tags: [Products]
      summary: Batch public variants by skuId
      operationId: productListVariantsBySkuIDs
      description: |
        Public batch lookup by canonical ULID `skuId`. Comma-separated `sku_ids` (max 50, deduped).
        Returns active variants whose parent products are also active. Unknown, draft/archived,
        or inactive-parent ids appear in `missing` (same visibility as single-variant lookups).
      parameters:
        - name: sku_ids
          in: query
          required: true
          schema:
            type: string
          description: Comma-separated canonical skuId values (max 50)
          example: "01HXYZ...,01HABC..."
      responses:
        '200':
          description: Batch result
          content:
            application/json:
              schema:
                type: object
                required: [items, missing]
                properties:
                  items:
                    type: array
                    items:
                      $ref: '#/components/schemas/Variant'
                  missing:
                    type: array
                    items:
                      type: string
                    description: Requested skuIds that were not publicly visible
        '400':
          $ref: '#/components/responses/BadRequest'
        '500':
          $ref: '#/components/responses/InternalError'

  /api/v1/products/variants/by-sku/{sku}:
    get:
      tags: [Products]
      summary: Public variant by human SKU
      operationId: productGetVariantBySKU
      parameters:
        - name: sku
          in: path
          required: true
          schema:
            type: string
      responses:
        '200':
          description: Active variant
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Variant'
        '404':
          $ref: '#/components/responses/NotFound'
        '500':
          $ref: '#/components/responses/InternalError'

  /api/v1/products/variants/by-sku-id/{skuId}:
    get:
      tags: [Products]
      summary: Public variant by canonical skuId
      operationId: productGetVariantBySkuID
      parameters:
        - name: skuId
          in: path
          required: true
          schema:
            type: string
      responses:
        '200':
          description: Active variant
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Variant'
        '404':
          $ref: '#/components/responses/NotFound'
        '500':
          $ref: '#/components/responses/InternalError'

  /api/v1/variants/{sku}:
    get:
      tags: [Products]
      summary: Public variant by human SKU (legacy alias)
      deprecated: true
      operationId: productGetVariantBySKULegacy
      parameters:
        - name: sku
          in: path
          required: true
          schema:
            type: string
      responses:
        '200':
          description: Active variant
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Variant'
        '404':
          $ref: '#/components/responses/NotFound'
        '500':
          $ref: '#/components/responses/InternalError'

  /api/v1/variants/by-sku-id/{skuId}:
    get:
      tags: [Products]
      summary: Public variant by canonical skuId (legacy alias)
      deprecated: true
      operationId: productGetVariantBySkuIDLegacy
      parameters:
        - name: skuId
          in: path
          required: true
          schema:
            type: string
      responses:
        '200':
          description: Active variant
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Variant'
        '404':
          $ref: '#/components/responses/NotFound'
        '500':
          $ref: '#/components/responses/InternalError'

  /api/v1/products/{id}/variants:
    post:
      tags: [Products]
      summary: Create a variant (SKU)
      operationId: productCreateVariant
      security:
        - bearerAuth: []
      parameters:
        - $ref: '#/components/parameters/ProductId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/VariantInput'
      responses:
        '201':
          description: Created variant
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Variant'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '500':
          $ref: '#/components/responses/InternalError'

  /api/v1/products/{id}/variants/{sku}:
    put:
      tags: [Products]
      summary: Update a variant
      operationId: productUpdateVariant
      security:
        - bearerAuth: []
      parameters:
        - $ref: '#/components/parameters/ProductId'
        - $ref: '#/components/parameters/VariantSku'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/VariantInput'
      responses:
        '200':
          description: Updated variant
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Variant'
        '404':
          $ref: '#/components/responses/NotFound'
    delete:
      tags: [Products]
      summary: Delete a variant
      operationId: productDeleteVariant
      security:
        - bearerAuth: []
      parameters:
        - $ref: '#/components/parameters/ProductId'
        - $ref: '#/components/parameters/VariantSku'
      responses:
        '204':
          description: Variant deleted
        '404':
          $ref: '#/components/responses/NotFound'

  /api/v1/products/{id}/variants/{sku}/images:
    post:
      tags: [Products]
      summary: Upload a variant image
      operationId: productUploadVariantImage
      security:
        - bearerAuth: []
      parameters:
        - $ref: '#/components/parameters/ProductId'
        - $ref: '#/components/parameters/VariantSku'
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              required: [image]
              properties:
                image:
                  type: string
                  format: binary
      responses:
        '201':
          description: Variant with updated imageUrls
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Variant'
        '400':
          $ref: '#/components/responses/BadRequest'
        '500':
          $ref: '#/components/responses/InternalError'

  /api/v1/products/inventory/items/{sku}:
    get:
      tags: [Inventory]
      summary: Get stock for a human SKU
      operationId: inventoryGetItem
      description: Public read. Legacy alias `GET /api/v1/inventory/{sku}`.
      parameters:
        - $ref: '#/components/parameters/VariantSku'
      responses:
        '200':
          description: Stock item
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/StockItem'
        '400':
          $ref: '#/components/responses/BadRequest'
        '404':
          $ref: '#/components/responses/NotFound'
        '500':
          $ref: '#/components/responses/InternalError'
    put:
      tags: [Inventory]
      summary: Set stock quantity
      operationId: inventoryUpsertItem
      security:
        - bearerAuth: []
      x-required-permissions: [inventory.stock.write]
      description: |
        Sets the absolute on-hand quantity. Rejected with `400` when the quantity is
        negative or lower than the currently reserved amount.
      parameters:
        - $ref: '#/components/parameters/VariantSku'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/StockQuantityInput'
      responses:
        '200':
          description: Updated stock item
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/StockItem'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '500':
          $ref: '#/components/responses/InternalError'

  /api/v1/products/inventory/items/{sku}/adjust:
    post:
      tags: [Inventory]
      summary: Adjust stock by a signed delta
      operationId: inventoryAdjustItem
      security:
        - bearerAuth: []
      x-required-permissions: [inventory.stock.write]
      description: |
        Creates the stock row at zero when missing, then applies the delta. Rejected with
        `400` when the result would be negative or below the reserved amount.
      parameters:
        - $ref: '#/components/parameters/VariantSku'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/StockDeltaInput'
      responses:
        '200':
          description: Updated stock item
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/StockItem'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '500':
          $ref: '#/components/responses/InternalError'

  /api/v1/products/inventory/items/by-sku-id/{skuId}:
    get:
      tags: [Inventory]
      summary: Get stock by canonical skuId
      operationId: inventoryGetItemBySkuId
      description: Public read. Preferred over the human-SKU form.
      parameters:
        - $ref: '#/components/parameters/VariantSkuId'
      responses:
        '200':
          description: Stock item
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/StockItem'
        '400':
          $ref: '#/components/responses/BadRequest'
        '404':
          $ref: '#/components/responses/NotFound'
        '500':
          $ref: '#/components/responses/InternalError'
    put:
      tags: [Inventory]
      summary: Set stock quantity by canonical skuId
      operationId: inventoryUpsertItemBySkuId
      security:
        - bearerAuth: []
      x-required-permissions: [inventory.stock.write]
      parameters:
        - $ref: '#/components/parameters/VariantSkuId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/StockQuantityInput'
      responses:
        '200':
          description: Updated stock item
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/StockItem'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '500':
          $ref: '#/components/responses/InternalError'

  /api/v1/products/inventory/items/by-sku-id/{skuId}/adjust:
    post:
      tags: [Inventory]
      summary: Adjust stock by a signed delta, by canonical skuId
      operationId: inventoryAdjustItemBySkuId
      security:
        - bearerAuth: []
      x-required-permissions: [inventory.stock.write]
      parameters:
        - $ref: '#/components/parameters/VariantSkuId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/StockDeltaInput'
      responses:
        '200':
          description: Updated stock item
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/StockItem'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '500':
          $ref: '#/components/responses/InternalError'

  /api/v1/products/inventory/reservations:
    post:
      tags: [Inventory]
      summary: Reserve stock for an order
      operationId: inventoryCreateReservation
      security:
        - bearerAuth: []
      x-required-permissions: [inventory.reservation.manage]
      description: |
        Called by the order service when an order or checkout completion is created.
        Identify each line by `skuId` (preferred) or human `sku`.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ReservationInput'
      responses:
        '201':
          description: Reservation created with status `active`
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ReservationCreated'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '500':
          $ref: '#/components/responses/InternalError'

  /api/v1/products/inventory/reservations/{id}/commit:
    post:
      tags: [Inventory]
      summary: Commit a reservation (deduct stock)
      operationId: inventoryCommitReservation
      security:
