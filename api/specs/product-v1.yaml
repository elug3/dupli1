components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
      description: Access token from auth service refresh endpoint

  parameters:
    ProductId:
      name: id
      in: path
      required: true
      schema:
        type: string
      example: BOT-001
    VariantSku:
      name: sku
      in: path
      required: true
      schema:
        type: string
      example: BOT-001-GRN
    CouponCode:
      name: code
      in: path
      required: true
      schema:
        type: string
      example: SUMMER30
    VariantSkuId:
      name: skuId
      in: path
      required: true
      description: Canonical ULID variant id
      schema:
        type: string
    ReservationId:
      name: id
      in: path
      required: true
      schema:
        type: string
    MasterCode:
      name: code
      in: path
      required: true
      description: Master-data code (uppercase; immutable)
      schema:
        type: string
      example: BOT
    StyleCode:
      name: styleCode
      in: path
      required: true
      schema:
        type: string
      example: CAS001

  schemas:
    Settings:
      type: object
      required: [service, api_version]
      properties:
        service:
          type: string
          example: product
        api_version:
          type: string
          example: v1
        auth:
          type: object
          properties:
            mode:
              type: string
            jwks_configured:
              type: boolean
            jwt_secret_fallback:
              type: boolean
        storage:
          type: string
        features:
          type: object
          additionalProperties:
            type: boolean
        limits:
          type: object
          additionalProperties: true
        dependencies:
          type: object
          additionalProperties:
            type: object
            properties:
              configured:
                type: boolean
              host:
                type: string

    ErrorResponse:
      type: object
      required: [error, code]
      properties:
        error:
          type: string
        code:
          type: integer

    ProductStatus:
      type: string
      enum: [active, draft, archived]

    Product:
      type: object
      properties:
        id:
          type: string
          example: BOT-001
        name:
          type: string
        description:
          type: string
        officialPrice:
          type: number
          format: double
          description: Reference / list price in KRW won (display only; not charged)
        price:
          type: number
          format: double
          description: Actual sale price in KRW won after discounts (whole won; charged)
        brand:
          type: string
        brandCode:
          type: string
          description: Immutable 2–3 letter brand code (e.g. BOT). See product-sku-system.md.
        styleCode:
          type: string
          description: Immutable style code unique within brand (e.g. CAS001).
        color:
          type: string
        material:
          type: string
        stock:
          type: integer
        category:
          type: string
        subCategory:
          type: string
          description: Bag type (handbags, tote, shoulder, cross, mini)
        style:
          type: string
          description: Bag occasion/look (casual, evening, business, weekend, statement); not styleCode
        target:
          type: string
          description: Audience (all, men, women, kids)
        status:
          $ref: '#/components/schemas/ProductStatus'
        imageUrls:
          type: array
          items:
            type: string
            format: uri
        capacity:
          type: string
        tags:
          type: array
          items:
            type: string
        attributes:
          type: object
          additionalProperties:
            type: string
          description: >
            Free-form string key/value memo for PDP display (condition, care, authenticity, etc.).
            Not used for search, pricing, or checkout. Managers write via create/update;
            storefront treats as read-only. Max 32 entries; key ≤64 / value ≤512 chars.
          example:
            condition: excellent
            care: wipe with dry cloth
        viewCount:
          type: integer
          format: int64
          description: Unique guest PDP views (denormalized). Public on PDP and recommendations.
        soldCount:
          type: integer
          format: int64
          description: >
            Units sold for this parent style (denormalized). Incremented when an inventory
            reservation is committed (order ship → in_transit), not on payment or reserve.
        wishlistCount:
          type: integer
          format: int64
          description: Unique owners who wishlisted this parent (denormalized).
        createdAt:
          type: string
          format: date-time
        defaultImageUrl:
          type: string
        availableColors:
          type: array
          items:
            type: string
        availableSizes:
          type: array
          items:
            type: string
        variants:
          type: array
          items:
            $ref: '#/components/schemas/Variant'

    Variant:
      type: object
      required: [sku, productId, color, status]
      properties:
        skuId:
          type: string
          description: Canonical ULID identifier
        sku:
          type: string
          example: BOT_CAS001_BLK_V_MED
          description: Human SKU (Brand_Style_Color[_Edition]_Size). See product-sku-system.md.
        productId:
          type: string
          example: BOT-001
        color:
          type: string
        size:
          type: string
        colorCode:
          type: string
          example: BLK
        editionCode:
          type: string
          example: V
          description: Optional construction/edition (VariantCode segment)
        sizeCode:
          type: string
          example: MED
        officialPrice:
          type: number
          format: double
          description: Reference / list price copied from parent (display only; read-only on variant)
        price:
          type: number
          format: double
          description: Actual sale price copied from parent (charged; read-only on variant)
        status:
          $ref: '#/components/schemas/ProductStatus'
        imageUrls:
          type: array
          items:
            type: string
            format: uri
        createdAt:
          type: string
          format: date-time

    VariantInput:
      type: object
      properties:
        sku:
          type: string
          description: Optional; auto-composed from brand/style/color/edition/size codes when omitted
        color:
          type: string
        size:
          type: string
        colorCode:
          type: string
        editionCode:
          type: string
        sizeCode:
          type: string
        status:
          $ref: '#/components/schemas/ProductStatus'
        imageUrls:
          type: array
          items:
            type: string
            format: uri

    PublicProduct:
      description: Public product view
      allOf:
        - $ref: '#/components/schemas/Product'

    ProductInput:
      type: object
      properties:
        id:
          type: string
        name:
          type: string
        description:
          type: string
        officialPrice:
          type: number
          format: double
          description: Reference / list price (display only; not charged)
        price:
          type: number
          format: double
          description: Actual sale price after discounts (charged)
        brand:
          type: string
        brandCode:
          type: string
          description: Optional; resolved from brand name when omitted
        styleCode:
          type: string
          description: Optional; derived from product id (e.g. BOT-001 → S001) when omitted
        color:
          type: string
        material:
          type: string
        stock:
          type: integer
        category:
          type: string
        subCategory:
          type: string
        style:
          type: string
          description: Bag occasion/look; not styleCode
        target:
          type: string
        status:
          $ref: '#/components/schemas/ProductStatus'
        imageUrls:
          type: array
          items:
            type: string
            format: uri
        capacity:
          type: string
        attributes:
          type: object
          additionalProperties:
            type: string
          description: >
            Free-form string key/value memo. Omitted on PUT keeps current map;
            `{}` clears. Not used for search/pricing/checkout.

    ProductSearchResponse:
      type: object
      required: [total, limit, offset, sort, order, results]
      properties:
        total:
          type: integer
        limit:
          type: integer
        offset:
          type: integer
        sort:
          type: string
          description: Effective sort key applied
        order:
          type: string
          enum: [asc, desc]
        period:
          type: string
          description: Effective created-at window when requested (day|week|month)
          enum: [day, week, month]
        results:
          type: array
          items:
            $ref: '#/components/schemas/PublicProduct'

    WishlistMutationResponse:
      type: object
      required: [productId, wishlisted, wishlistCount]
      properties:
        productId:
          type: string
        wishlisted:
          type: boolean
        wishlistCount:
          type: integer
          format: int64

    RecommendationsResponse:
      type: object
      required: [seedId, items]
      properties:
        seedId:
          type: string
          description: Echo of the path product id
        items:
          type: array
          description: Ordered related parent cards (never null; empty when none)
          items:
            $ref: '#/components/schemas/PublicProduct'

    Coupon:
      type: object
      required: [code, discount, description, expires, active]
      properties:
        code:
          type: string
          example: SUMMER30
        discount:
          type: number
          format: double
          description: Fraction (0.30 = 30%)
          example: 0.30
        description:
          type: string
        expires:
          type: string
          example: Aug 31, 2026
        active:
          type: boolean

    CouponInput:
      type: object
      required: [code, discount]
      properties:
        code:
          type: string
        discount:
          type: number
          format: double
        description:
          type: string
        expires:
          type: string
        active:
          type: boolean
          default: true

    CouponUpdate:
      type: object
      properties:
        discount:
          type: number
          format: double
        description:
          type: string
        expires:
          type: string
        active:
          type: boolean

    CouponSearchResponse:
      type: object
      required: [total, results]
      properties:
        total:
          type: integer
        results:
          type: array
          items:
            $ref: '#/components/schemas/Coupon'

    StockItem:
      type: object
      required: [skuId, quantity, reserved, updated_at]
      properties:
        skuId:
          type: string
          description: Canonical ULID variant id
        sku:
          type: string
          example: BOT-001-GRN
        quantity:
          type: integer
          description: On-hand quantity, including the reserved portion
        reserved:
          type: integer
          description: Quantity held by active reservations
        updated_at:
          type: string
          format: date-time

    StockQuantityInput:
      type: object
      required: [quantity]
      properties:
        quantity:
          type: integer
          minimum: 0

    StockDeltaInput:
      type: object
      required: [delta]
      properties:
        delta:
          type: integer
          description: Signed change; negative decrements stock
          example: -5

    ReservationStatus:
      type: string
      enum: [active, committed, released]

    ReservationItem:
      type: object
      required: [skuId, quantity]
      properties:
        skuId:
          type: string
        sku:
          type: string
        quantity:
          type: integer
          minimum: 1

    ReservationInput:
      type: object
      required: [order_id, items]
      properties:
        order_id:
          type: string
          example: ord_000001
        items:
          type: array
          minItems: 1
          items:
            type: object
            required: [quantity]
            properties:
              skuId:
                type: string
                description: Canonical ULID variant id (preferred)
              sku:
                type: string
                description: Human SKU; used when skuId is absent
              quantity:
                type: integer
                minimum: 1

    Reservation:
      type: object
      required: [id, order_id, items, status, created_at, updated_at]
      properties:
        id:
          type: string
        order_id:
          type: string
        items:
          type: array
          items:
            $ref: '#/components/schemas/ReservationItem'
        status:
          $ref: '#/components/schemas/ReservationStatus'
        created_at:
          type: string
          format: date-time
        updated_at:
          type: string
          format: date-time

    ReservationCreated:
      type: object
      required: [reservation_id, reservation]
      properties:
        reservation_id:
          type: string
        reservation:
          $ref: '#/components/schemas/Reservation'

    CatalogTerm:
      type: object
      required: [code, name]
      properties:
        code:
          type: string
        name:
          type: string

    Brand:
      type: object
      required: [code, name]
      properties:
        code:
          type: string
          example: BOT
        name:
          type: string
          example: Bottega Veneta

    Style:
      type: object
      required: [brandCode, code, name]
      properties:
        brandCode:
          type: string
          example: BOT
        code:
          type: string
          example: CAS001
        name:
          type: string

    MasterCatalog:
      type: object
      required: [subCategories, styles, targets]
      properties:
        subCategories:
          type: array
          items:
            $ref: '#/components/schemas/CatalogTerm'
        styles:
          type: array
          items:
            $ref: '#/components/schemas/CatalogTerm'
        targets:
          type: array
          items:
            $ref: '#/components/schemas/CatalogTerm'

    CodeNameInput:
      type: object
      required: [code, name]
      properties:
        code:
          type: string
        name:
          type: string

    NameInput:
      type: object
      required: [name]
      properties:
        name:
          type: string

  responses:
    BadRequest:
      description: Invalid request
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
    Unauthorized:
      description: Missing or invalid Bearer token
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
    Conflict:
      description: Master data already exists or is still in use
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
    Forbidden:
      description: Valid token but the required permission is missing
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
    NotFound:
      description: Resource not found
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
    InternalError:
      description: Internal server error
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
