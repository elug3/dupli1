openapi: 3.1.0
info:
  title: Dupli1 API
  version: 1.0.0
  description: |
    Cross-service index of the Dupli1 fashion bag marketplace API, annotated with the
    permission each route requires (`x-required-permissions`).

    **Scope:** this file is a gateway-level route index, not the full contract. Request and
    response schemas live in the per-service specs, which are authoritative:
    [auth](../api/specs/auth-v1.yaml), [product](../api/specs/product-v1.yaml)
    (including inventory, catalog and coupons), [order](../api/specs/order-v1.yaml)
    (including checkout sessions) and [notification](../api/specs/notification-v1.yaml).
    Cart and payment have no dedicated spec yet — see [api.md](api.md) and
    [payment-service.md](payment-service.md).

    **Authorization:** protected routes require `Authorization: Bearer <access_token>`.
    Access tokens include a `permissions` string array. See [permissions.md](permissions.md) for the catalog.
    An empty `security` block with no `x-required-permissions` means any authenticated caller,
    subject to ABAC on their own records.

    **Paths:** routes are namespaced by owning service. Older top-level prefixes
    (`/api/v1/inventory`, `/api/v1/catalog`, `/api/v1/coupons`, `/api/v1/variants`,
    `/api/v1/checkout`, `/api/v1/carts`) remain registered as aliases but are omitted here.
    Per-service `/health` and `/settings` routes are public and also omitted, except
    notification's health check, which is the only route that service exposes.

    Gateway base URL (local): `http://localhost:8080`

servers:
  - url: http://localhost:8080
    description: Local nginx gateway

components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
      description: |
        RS256 access token from `POST /api/v1/auth/refresh`.
        Claims: `sub`, `type: access`, `permissions` (string[]).

paths:
  /api/v1/auth/login:
    post:
      summary: Exchange credentials for a refresh token
      tags: [Auth]
      responses:
        '200':
          description: Success

  /api/v1/auth/refresh:
    post:
      summary: Exchange a refresh token for an access token
      tags: [Auth]
      responses:
        '200':
